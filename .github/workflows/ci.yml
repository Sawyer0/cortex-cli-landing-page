name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build

  e2e:
    name: End-to-end (Playwright + axe)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Install Playwright Chromium
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: End-to-end tests (production build)
        run: bun run e2e
        env:
          CI: "true"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (mobile)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Lighthouse CI (waits for "Ready in" from next start, then asserts budgets)
        run: bun run lhci
      - name: Summarise scores
        if: always()
        run: |
          node -e '
            const fs = require("fs")
            const dir = ".lighthouseci"
            if (!fs.existsSync(dir)) process.exit(0)
            const rows = {}
            for (const file of fs.readdirSync(dir).filter((name) => /^lhr-.*\.json$/.test(name))) {
              const lhr = JSON.parse(fs.readFileSync(`${dir}/${file}`, "utf8"))
              const c = lhr.categories, a = lhr.audits
              ;(rows[lhr.requestedUrl] ??= []).push([c.performance.score, c.accessibility.score, c["best-practices"].score, c.seo.score].map((s) => Math.round(s * 100)).join("/") +
                ` LCP ${Math.round(a["largest-contentful-paint"].numericValue)}ms CLS ${a["cumulative-layout-shift"].numericValue.toFixed(3)} TBT ${Math.round(a["total-blocking-time"].numericValue)}ms`)
            }
            let out = "| URL | Runs (Perf/A11y/BP/SEO) |\n|---|---|\n"
            for (const [url, runs] of Object.entries(rows)) out += `| ${url} | ${runs.join("<br>")} |\n`
            console.log(out)
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out)
          '
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
